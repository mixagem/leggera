<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
</head>

<body><br>
    <style>
        #wantalerts-radio-option {
            position: absolute;
            font-size: 30px;
            margin-top: -5px;
            margin-right: -5px;
            margin-left: -5px;
            color: rgb(104, 1, 1);
            z-index: 3;
            cursor: pointer;
        }

        #wantalerts-radio-option-bg {
            position: relative;
            background-color: #fff;
            width: 24px;
            height: 20px;
            z-index: 2;
            margin-right: -5px;
            margin-left: -5px;
            border-radius: 50%;
            padding-right: 3px;
            padding-left: 3px;
            background-clip: content-box;
        }

        .mix-toggle-0,
        .mix-toggle-1 {
            width: 50px;
            border-radius: 25px;
            height: 20px;
            z-index: 1;
        }

        .mix-toggle-0 {
            background-color: rgb(253, 135, 135);
            transition-duration: .5s;
            display: flex;
            justify-content: left;
        }

        .mix-toggle-1 {
            background-color: rgb(44, 214, 44);
            transition-duration: .5s;
            display: flex;
            justify-content: right;
        }
    </style>

    <div style="display:flex;justify-content:center;">

        <span id="here" class="mix-toggle-0">
            <span id="wantalerts-radio-option" class="material-icons">
                cancel
            </span>
            <span id="wantalerts-radio-option-bg">
            </span>
            <!-- <span class="material-icons">
                check_circle
            </span> -->

        </span>
        <script>
            document.querySelector('#here').addEventListener('click', function () {
                if (document.querySelector('#here').classList.contains('mix-toggle-0')) {
                    document.querySelector('#here').classList = 'mix-toggle-1'
                    document.querySelector('#wantalerts-radio-option').innerText = 'check_circle'
                    document.querySelector('#wantalerts-radio-option').style.color = 'rgb(1, 100, 1)'
                    document.querySelector('#wantalerts-radio-option').classList = 'material-icons animate__animated animate__slideInLeft'
                    document.querySelector('#wantalerts-radio-option-bg').classList = 'animate__animated animate__slideInLeft'
                } else {
                    document.querySelector('#here').classList = 'mix-toggle-0'
                    document.querySelector('#wantalerts-radio-option').innerText = 'cancel'
                    document.querySelector('#wantalerts-radio-option').style.color = 'rgb(104, 1, 1)'
                    document.querySelector('#wantalerts-radio-option').classList = 'material-icons animate__animated animate__slideInRight'
                    document.querySelector('#wantalerts-radio-option-bg').classList = 'animate__animated animate__slideInRight'
                }
            })
        </script>
    </div>
</body>

</html>

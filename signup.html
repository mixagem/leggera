<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>.:&nbsp;HelpCenter+&nbsp;Superleggera&nbsp;edition&nbsp;:.&nbsp;</title>
    <link rel="stylesheet" type="text/css" href="assets/css/style.css">
    <link rel="stylesheet" type="text/css" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="assets/css/font-awesome.min.css">
    <link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/icon?family=Material+Icons">

        href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

<body>
    <div id="loading-wrapper">
        <span id="loading-gif" class="animate__animated animate__fadeIn"></span>
        <span id="loading-gif-red" class="animate__animated animate__fadeIn"></span>
        <div id="loading-title" class="animate__animated animate__fadeIn animate__delay-1s">SUPERLEGGERA</div>

        <div id="login-wrapper" class="no-opacity">
            <span>Username:</span>
            <input id="username" name="username"></input>
            <span>Password:</span>
            <input id="password" name="password" type="password"></input>
            <span>Nome:</span>
            <input id="nome" name="nome" type="text"></input>
            <button id="login-btn" class="btn btn-warning">Criar utilizador</button>
        </div>
    </div>
</body>

<script src="assets/js/jquery.min.js" type="text/javascript"></script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #landing, #resto {
            height: 100vh;
            background-color: #000;
            margin:0;
            padding:0;
        }
        #resto {background-color: pink!important;}
        .no-display {display:none;}


    </style>
</head>
<body>
    <div id="landing"><img src="assets/img/mi.gif"></div>
    <div id="resto"></div>
</body>
<script src="assets/js/jquery.min.js" type="text/javascript"></script>
<script>
    
(function preLoad () {
    let landing = document.querySelector('#landing');
    let landingKid = document.querySelector('#landing').firstChild;
    landingKid.fadeIn(400);
    landing.classList.delay(2000).add('.no-display');
})();

</script>
</html>
